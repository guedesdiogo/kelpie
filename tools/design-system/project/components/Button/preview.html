<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="k-stage">
  <div class="k-row">
    <button type="button" class="k-btn primary text-ui">Confirm</button>
    <button type="button" class="k-btn text-ui">Deny this call</button>

  </div>
  <p class="k-caption text-sm">Press and hold one: it scales to 0.97 within 100 ms and commits when you let go.</p>
</div>
