name: Deploy

# Deploys main to production: CI calls it after every gate passes on a push to main, and it runs by
# hand to deploy main again, for example after a rollback (docs/deploy.md). It skips when nothing
# that ships changed since the builds production serves, unless `always` is set (ADR-0031).
on:
  workflow_call:
    inputs:
      watch-minutes:
        description: Minutes to watch production before keeping the release
        default: "10"
        type: string
      always:
        description: Deploy even when nothing that ships changed since the live builds
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      watch-minutes:
        description: Minutes to watch production before keeping the release
        default: "10"
        type: string
      always:
        description: Deploy even when nothing that ships changed since the live builds
        default: true
        type: boolean
      # Merges never rotate: each upload is a secret change that rollbacks must force past.
      rotate-probe-token:
        description: Upload DEPLOY_PROBE_TOKEN to ingress even though it holds one (a rotation)
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    # One deploy or rollback at a time, and never cancelled halfway.
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build number counts main's first-parent commits, and rollback barriers and the
          # changes that ship are read from the live commit to this one.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Deploy, verify, and roll back if production is unhealthy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional: it signs the deep probe, which is skipped while it's unset, and goes to ingress
          # when ingress has none, or on a rotation.
          DEPLOY_PROBE_TOKEN: ${{ secrets.DEPLOY_PROBE_TOKEN }}
          # Optional: the VPC Service that reaches the owner's runner, an environment variable. It
          # becomes channel-egress's RUNNER binding; while it's unset, the runner is off (docs/runner.md).
          RUNNER_VPC_SERVICE_ID: ${{ vars.RUNNER_VPC_SERVICE_ID }}
          WRANGLER_SEND_METRICS: "false"
          WATCH_MINUTES: ${{ inputs.watch-minutes }}
          ALWAYS: ${{ inputs.always }}
          ROTATE_PROBE_TOKEN: ${{ inputs.rotate-probe-token }}
        run: |
          args=(--watch-minutes "${WATCH_MINUTES:-10}" --report "$RUNNER_TEMP/release.md")
          if [ "$ALWAYS" = "true" ]; then args+=(--always); fi
          # A rotation deploys even when nothing ships, so the new token reaches ingress.
          if [ "${ROTATE_PROBE_TOKEN:-false}" = "true" ]; then args+=(--rotate-probe-token --always); fi
          bun run --cwd tools/release release deploy "${args[@]}"
      - name: Open an issue for the failed deploy
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/release.md"
          [ -f "$report" ] || echo "The deploy stopped before it wrote a report." > "$report"
          printf '\n[The run](%s)\n' "$RUN_URL" >> "$report"
          tag="$(git rev-list --count --first-parent HEAD)-$(git rev-parse --short=7 HEAD)"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Production deploy of $tag failed" --body-file "$report"
