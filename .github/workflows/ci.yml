name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new commit replaces a PR's run. Runs on main deploy, so they are never cancelled halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request runs only the gates its change can affect; the others skip (ADR-0038). A gate
  # whose output isn't `false` runs, so a push to main, or an output this job didn't write, runs it.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.gates.outputs.checks }}
      build: ${{ steps.gates.outputs.build }}
      migrations: ${{ steps.gates.outputs.migrations }}
      workflows: ${{ steps.gates.outputs.workflows }}
      dependency-review: ${{ steps.gates.outputs.dependency-review }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD^1 is the base: main's tip for a PR's merge commit.
          fetch-depth: 2
          persist-credentials: false
      # tools/release needs no dependencies to run, only Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - id: gates
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "A push to \`main\` runs every gate (ADR-0031)." >> "$GITHUB_STEP_SUMMARY"
          # The rule never judges a change to itself or to this workflow.
          elif ! git diff --quiet HEAD^1 HEAD -- tools/release .github/workflows/ci.yml; then
            echo "This change touches \`tools/release\` or \`ci.yml\`, so every gate runs." >> "$GITHUB_STEP_SUMMARY"
          else
            bun run --cwd tools/release release gates --base HEAD^1
          fi

  checks:
    name: Lint, typecheck and test
    needs: changes
    if: needs.changes.outputs.checks != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run check:workspaces
      - run: bun run lint
      - run: bun run typecheck
      # The tests, once, with coverage: each workspace fails below its thresholds (docs/testing.md).
      - id: tests
        run: bun run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && steps.tests.conclusion != 'skipped' }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Workers
    needs: changes
    if: needs.changes.outputs.build != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Bundles each Worker with its real configuration, as a deploy does, with no account.
      - name: Bundle every Worker
        run: |
          for config in apps/*/wrangler.jsonc; do
            app="$(dirname "$config")"
            echo "::group::$app"
            (cd "$app" && ./node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundles/${app#apps/}")
            echo "::endgroup::"
          done

  migrations:
    name: Migrations
    needs: changes
    if: needs.changes.outputs.migrations != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD^1 is the base: main's tip for a PR's merge commit, the previous tip on main.
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Schemas match their migrations
        run: |
          for config in apps/*/drizzle*.config.ts; do
            (
              cd "$(dirname "$config")"
              ./node_modules/.bin/drizzle-kit generate --config "$(basename "$config")" < /dev/null
              ./node_modules/.bin/drizzle-kit check --config "$(basename "$config")"
            )
          done
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::A schema changed without its migration. Run 'bun run db:generate' in that Worker and commit the result."
            exit 1
          fi
      # Journals in order, applied migrations untouched, and rollback barriers acknowledged (ADR-0029).
      - name: Migrations are safe to deploy and to roll back
        run: bun run --cwd tools/release release guard --base HEAD^1

  workflows:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint runs shellcheck, preinstalled on the runner, over every run: block.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  dependency-review:
    name: Dependency review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.dependency-review != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # The one check the ruleset requires, so a new gate needs no ruleset change.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, checks, build, migrations, workflows, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Detect changes must pass. A gate may skip only when Detect changes said so, and Dependency
      # review also outside pull requests. Any other skip, as when Detect changes fails, fails here.
      - name: Every gate passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e --arg event "$EVENT" '
            .changes.result == "success" and (.changes.outputs as $decided | del(.changes) | to_entries | all(
              .value.result == "success" or (.value.result == "skipped" and
                ($decided[.key] == "false" or (.key == "dependency-review" and $event != "pull_request")))))
          ' <<< "$NEEDS" > /dev/null

  # The deploy skips when nothing that ships changed since the builds production serves (ADR-0031).
  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, build, migrations, workflows]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/deploy.yml
    # The called job's production environment gives it its secrets, but only through `inherit`:
    # without it they arrive empty (#238). Deploy credentials live only in that environment.
    secrets: inherit
