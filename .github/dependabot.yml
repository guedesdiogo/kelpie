# Dependabot keeps the GitHub Actions pins current (issue #251).
#
# Only the github-actions ecosystem is enabled. The workflows and the setup
# action pin every action to a commit SHA, and Dependabot opens a PR with the
# new SHA and its release notes; it goes through the same gates as any PR.
#
# The Bun dependencies stay out: Dependabot's support for bun.lock is
# uncertain, and their updates are deliberate, made in the change that needs
# them.
#
# "/" covers .github/workflows and a root action.yml only, so the composite
# action in .github/actions/setup is listed on its own.

version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # Every action update in one PR.
      github-actions:
        patterns:
          - "*"
